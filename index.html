<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#9b4f70"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mi Lista de Compras">
<title>Mi Lista de Compras</title>
<style>
:root{--green:#9b4f70;--green2:#7d3d5b;--mint:#f8e8f0;--yellow:#f3b6c8;--ink:#432b38;--muted:#876f7c;--line:#ead8e1}*{box-sizing:border-box}body{margin:0;background:#f6faf8;color:var(--ink);font:16px system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:620px;margin:auto;min-height:100vh;padding:22px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.eyebrow{color:var(--green);font-weight:700;font-size:13px;letter-spacing:.04em}.title{font-size:30px;line-height:1.1;margin:4px 0;font-weight:800}.subtitle{color:var(--muted);margin:0}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 8px 24px #173f2b0b;margin-bottom:14px}.summary{background:var(--green);color:white;border:0}.summary-row{display:flex;justify-content:space-between;align-items:end}.summary strong{font-size:28px}.summary small{opacity:.82}.progress{height:9px;background:#ffffff40;border-radius:9px;overflow:hidden;margin-top:14px}.progress i{display:block;height:100%;background:var(--yellow);width:0;border-radius:9px}.form{display:grid;grid-template-columns:1fr 76px 92px 112px;gap:8px}.input,select{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfdfc;color:var(--ink);font:inherit;width:100%}button{border:0;border-radius:12px;padding:12px 14px;font:700 15px inherit;cursor:pointer}.add{background:var(--yellow);color:#493900;width:100%;margin-top:9px}.filters{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.filter{background:var(--mint);color:var(--green);white-space:nowrap}.filter.active{background:var(--green);color:white}.section-title{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin:18px 2px 8px}.section-title span{font-size:13px;color:var(--muted);font-weight:600}.item{display:flex;align-items:center;gap:11px;padding:12px 2px;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.check{width:25px;height:25px;border:2px solid #9bb7a9;border-radius:8px;padding:0;background:white;color:white;flex:none}.item.done .check{background:var(--green);border-color:var(--green)}.item.done .name{text-decoration:line-through;color:#91a19b}.details{flex:1;min-width:0}.name{font-weight:700}.meta{font-size:13px;color:var(--muted);margin-top:2px}.remove{background:transparent;color:#a5b3ad;padding:6px;font-size:20px}.empty{text-align:center;color:var(--muted);padding:22px 8px}.footer-actions{display:flex;gap:8px;flex-wrap:wrap}.secondary{background:var(--mint);color:var(--green);flex:1}.danger{background:#fff0ee;color:#a34b43;flex:1}.history-row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:10px 0}.history-row:last-child{border-bottom:0}.up{color:#b34b42;font-weight:800}.down{color:var(--green);font-weight:800}.same{color:var(--muted)}.price-edit{border:0;background:transparent;color:var(--green);font-size:12px;font-weight:800;padding:2px 0;cursor:pointer}@media(max-width:480px){.form{grid-template-columns:1fr 78px}.form select#cat{grid-column:1/-1}.form input:last-of-type{grid-column:1/2}.form select#unit{grid-column:2;grid-row:1}.add{grid-column:1/-1}.title{font-size:27px}}
</style></head>
<body><main class="app"><header class="top"><div><div class="eyebrow">TU COMPRA, MÁS FÁCIL</div><h1 class="title">Mi Lista de Compras</h1><p class="subtitle">Organiza tu compra con calma y sin olvidar nada.</p></div><div style="font-size:34px">🛍️</div></header>
<section class="card summary"><div class="summary-row"><div><small>Lista actual</small><div><strong>Supermercado</strong></div></div><div style="text-align:right"><small>Total estimado</small><div><strong id="total">$0</strong></div></div></div><div class="progress"><i id="bar"></i></div><small id="count">0 de 0 productos</small></section>
<section class="card"><div class="form"><input id="name" class="input" placeholder="Producto (ej. Arroz)" autocomplete="off"><input id="qty" class="input" type="number" min="0.1" step="0.1" value="1" aria-label="Cantidad"><select id="unit" class="input" aria-label="Unidad"><option>unidad</option><option>lb</option><option>oz</option><option>kg</option><option>g</option><option>litro</option><option>paquete</option><option>docena</option></select><input id="price" class="input" type="number" min="0" step="0.01" placeholder="Precio" aria-label="Precio"><select id="cat"><option>General</option><option>Frutas y vegetales</option><option>Carnes</option><option>Granos</option><option>Bebidas</option><option>Limpieza</option><option>Higiene</option></select></div><button class="add" id="add">＋ Agregar producto</button></section>
<div class="filters"><button class="filter active" data-filter="all">Todos</button><button class="filter" data-filter="pending">Pendientes</button><button class="filter" data-filter="done">Comprados</button></div>
<section class="card" style="padding:10px 16px"><div id="list"></div><div class="footer-actions"><button class="secondary" id="clear">Borrar comprados</button><button class="secondary" id="savePurchase">Guardar compra</button><button class="danger" id="reset">Vaciar lista</button></div></section><section class="card"><div class="section-title">Historial de compras <span>comparación de precios</span></div><div id="history"><div class="empty">Todavía no has guardado una compra.</div></div></section>
<p style="text-align:center;color:var(--muted);font-size:13px">Tus datos se guardan automáticamente en este dispositivo.</p></main>
<script>const $=s=>document.querySelector(s);let items=JSON.parse(localStorage.getItem('shopping-items')||'[]'),filter='all';const money=n=>'$'+Number(n||0).toLocaleString('es-DO',{maximumFractionDigits:2});function save(){localStorage.setItem('shopping-items',JSON.stringify(items));render()}function render(){let shown=items.filter(x=>filter==='all'||(filter==='done'?x.done:!x.done)),pending=items.filter(x=>!x.done).length,done=items.length-pending,total=items.reduce((a,x)=>a+(Number(x.price)||0)*(Number(x.qty)||1),0);$('#total').textContent=money(total);$('#count').textContent=`${done} de ${items.length} productos`;$('#bar').style.width=items.length?(done/items.length*100)+'%':'0%';$('#list').innerHTML=shown.length?shown.map(x=>`<div class="item ${x.done?'done':''}"><button class="check" data-check="${x.id}">${x.done?'✓':''}</button><div class="details"><div class="name">${esc(x.name)}</div><div class="meta">${x.qty} ${esc(x.unit||'unidad')} · ${esc(x.cat)}${x.price?' · '+money(x.price*x.qty):' · <button class="price-edit" data-price="'+x.id+'">＋ Poner precio</button>'}</div></div><button class="remove" data-remove="${x.id}" aria-label="Eliminar">×</button></div>`).join(''):'<div class="empty">No hay productos en esta vista.</div>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}$('#add').onclick=()=>{let name=$('#name').value.trim();if(!name){$('#name').focus();return}items.push({id:Date.now(),name,qty:Math.max(0.1,Number($('#qty').value)||1),unit:$('#unit').value,price:Number($('#price').value)||0,cat:$('#cat').value,done:false});$('#name').value='';$('#qty').value=1;$('#unit').value='unidad';$('#price').value='';save();$('#name').focus()};$('#name').onkeydown=e=>{if(e.key==='Enter')$('#add').click()};document.addEventListener('click',e=>{let c=e.target.closest('[data-check]'),r=e.target.closest('[data-remove]'),p=e.target.closest('[data-price]');if(c){let x=items.find(i=>i.id==c.dataset.check);x.done=!x.done;save()}if(r){items=items.filter(i=>i.id!=r.dataset.remove);save()}if(p){let x=items.find(i=>i.id==p.dataset.price),value=prompt('¿Cuál es el precio de '+x.name+'?','');if(value!==null&&value.trim()!==''&&!isNaN(value)){x.price=Number(value);save()}}let f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b===f));render()}});$('#clear').onclick=()=>{items=items.filter(x=>!x.done);save()};$('#reset').onclick=()=>{if(confirm('¿Vaciar toda la lista?')){items=[];save()}};let history=JSON.parse(localStorage.getItem('shopping-history')||'[]');function renderHistory(){let h=$('#history');if(!history.length){h.innerHTML='<div class="empty">Todavía no has guardado una compra.</div>';return}h.innerHTML=history.slice().reverse().map((p,ri)=>{let prior=history.slice(0,history.length-1-ri),rows=p.items.map(x=>{let old=null;for(let j=prior.length-1;j>=0;j--){old=prior[j].find(y=>y.name.toLowerCase()===x.name.toLowerCase());if(old)break}let change=old&&x.price&&old.price?x.price-old.price:0;let mark=change>0?`<span class="up">↑ ${money(change)}</span>`:change<0?`<span class="down">↓ ${money(Math.abs(change))}</span>`:'<span class="same">—</span>';return `<div class="history-row"><span>${esc(x.name)} <small>${x.qty} ${esc(x.unit||'unidad')}</small></span><span>${money(x.price)} ${mark}</span></div>`}).join('');return `<div style="font-weight:800;margin-top:10px">${p.date} · ${money(p.total)}</div>${rows}`}).join('')}$('#savePurchase').onclick=()=>{if(!items.length){alert('Agrega productos antes de guardar la compra.');return}history.push({date:new Date().toLocaleDateString('es-DO'),total:items.reduce((a,x)=>a+(Number(x.price)||0)*(Number(x.qty)||1),0),items:items.map(x=>({name:x.name,qty:x.qty,unit:x.unit||'unidad',price:Number(x.price)||0}))});localStorage.setItem('shopping-history',JSON.stringify(history));renderHistory();alert('Compra guardada en el historial.');};renderHistory();render();</script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js");}</script></body></html>
